<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TerminalHook · Background tasks</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --card: #fff;
        --fg: #18212f;
        --muted: #657083;
        --line: #dfe4ec;
        --accent: #167a62;
        --soft: #e6f4ee;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      html[data-theme="dark"] {
        --bg: #14181e;
        --card: #1d232c;
        --fg: #e7edf5;
        --muted: #9daabd;
        --line: #343d4b;
        --accent: #70d4b0;
        --soft: #223c34;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        max-width: 1100px;
        margin: auto;
        padding: 22px;
      }
      header,
      .toolbar,
      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 22px;
        letter-spacing: -0.6px;
        margin: 0;
      }
      p {
        margin: 5px 0;
        color: var(--muted);
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 1.3px;
        color: var(--accent);
        margin-bottom: 5px;
      }
      .toolbar {
        margin: 20px 0 14px;
      }
      button,
      select {
        font: inherit;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
        padding: 7px 12px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      label {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 18px 0;
      }
      .stat {
        padding: 12px 16px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .stat strong {
        display: block;
        font-size: 24px;
        font-weight: 600;
      }
      .stat span {
        font-size: 12px;
        color: var(--muted);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 0.9fr);
        gap: 14px;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .panel-title {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        font-weight: 600;
      }
      .task {
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 0;
        border-bottom: 1px solid var(--line);
        padding: 14px 16px;
      }
      .task:last-child {
        border-bottom: 0;
      }
      .task[aria-pressed="true"] {
        background: var(--soft);
        box-shadow: inset 3px 0 var(--accent);
      }
      .key {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        overflow-wrap: anywhere;
      }
      .badge {
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 2px 6px;
        font-size: 11px;
        font-weight: 500;
      }
      .badge[data-status="running"] {
        color: var(--accent);
        border-color: var(--accent);
      }
      .badge[data-status="failed"],
      .badge[data-status="uncertain"] {
        color: #cd6853;
      }
      .detail {
        padding: 15px;
        min-height: 240px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 7px 14px;
        font-size: 12px;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        max-height: 320px;
        overflow: auto;
        font:
          12px/1.6 ui-monospace,
          monospace;
      }
      .empty {
        padding: 30px 16px;
        text-align: center;
        color: var(--muted);
      }
      #notice {
        font-size: 12px;
        min-height: 20px;
        color: var(--muted);
      }
      #notice[data-error="true"] {
        color: #cd6853;
      }
      footer {
        font-size: 11px;
        color: var(--muted);
        margin-top: 15px;
      }
      @media (max-width: 650px) {
        main {
          padding: 14px;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .stats {
          gap: 6px;
        }
        .stat {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="eyebrow">TERMINALHOOK</div>
          <h1 data-i="title">Background tasks</h1>
          <p data-i="subtitle">Execution continues while your chat is idle.</p>
        </div>
        <select id="language" aria-label="Language">
          <option value="en">English</option>
          <option value="zh">简体中文</option>
        </select>
      </header>
      <div class="stats">
        <div class="stat">
          <strong id="count-active">0</strong
          ><span data-i="active">Active</span>
        </div>
        <div class="stat">
          <strong id="count-finished">0</strong
          ><span data-i="finished">Finished</span>
        </div>
        <div class="stat">
          <strong id="count-delivery">0</strong
          ><span data-i="attention">Delivery needs attention</span>
        </div>
      </div>
      <div class="toolbar">
        <div id="notice" role="status" aria-live="polite"></div>
        <div class="meta">
          <label
            ><input type="checkbox" id="auto" checked /><span data-i="auto"
              >Auto refresh</span
            ></label
          ><button id="refresh" data-i="refresh">Refresh</button>
        </div>
      </div>
      <div class="layout">
        <section class="panel" aria-label="Task list">
          <div class="panel-title" data-i="tasks">Tasks in this chat</div>
          <div id="tasks"></div>
        </section>
        <section class="panel" aria-label="Task details">
          <div class="panel-title" data-i="details">Task details</div>
          <div class="detail" id="detail"></div>
        </section>
      </div>
      <footer data-i="footer">
        Refreshes read task state directly. They do not ask the model to check
        progress.
      </footer>
    </main>
    <script>
      "use strict";
      const words = {
        en: {
          title: "Background tasks",
          subtitle: "Execution continues while your chat is idle.",
          active: "Active",
          finished: "Finished",
          attention: "Delivery needs attention",
          auto: "Auto refresh",
          refresh: "Refresh",
          tasks: "Tasks in this chat",
          details: "Task details",
          footer:
            "Refreshes read task state directly. They do not ask the model to check progress.",
          empty: "No background tasks in this chat yet.",
          select: "Select a task to inspect its result.",
          connecting: "Connecting to the MCP host…",
          standalone:
            "Open this panel through an MCP Apps host to connect to your tasks.",
          updated: "Updated",
          unlimited: "Until completion or cancellation",
          deadline: "Execution deadline",
          delivery: "Delivery",
          exit: "Exit code",
          duration: "Duration",
          output: "Output",
          nooutput: "No output received yet.",
          failed: "Refresh failed",
          status: "Status",
          id: "Task ID",
          cwd: "Working directory",
          receipt: "Delivery turn",
          truncated: "Showing the first 100 tasks",
        },
        zh: {
          title: "后台任务",
          subtitle: "聊天空闲时，任务仍会继续运行。",
          active: "运行中",
          finished: "已结束",
          attention: "交付需处理",
          auto: "自动刷新",
          refresh: "刷新",
          tasks: "当前聊天的任务",
          details: "任务详情",
          footer: "刷新直接读取任务状态，不会请求模型检查进度。",
          empty: "当前聊天还没有后台任务。",
          select: "选择一个任务，查看运行结果。",
          connecting: "正在连接 MCP 宿主…",
          standalone: "请通过支持 MCP Apps 的宿主打开此面板，以连接后台任务。",
          updated: "更新于",
          unlimited: "等待完成或主动取消",
          deadline: "执行期限",
          delivery: "结果交付",
          exit: "退出码",
          duration: "运行时长",
          output: "输出",
          nooutput: "暂未收到输出。",
          failed: "刷新失败",
          status: "状态",
          id: "任务 ID",
          cwd: "工作目录",
          receipt: "交付回合",
          truncated: "仅显示前 100 个任务",
        },
      };
      const statusZh = {
        queued: "排队中",
        submitted: "已提交",
        running: "运行中",
        completed: "已结束",
        cancelled: "已取消",
        failed: "失败",
        launch_failed: "启动失败",
        worker_failed: "后台服务失败",
        timed_out: "已超时",
        pending: "待交付",
        sending: "交付中",
        delivered: "已交付",
        uncertain: "交付待核实",
      };
      let language = navigator.language.startsWith("zh") ? "zh" : "en",
        nextId = 0,
        ready = false,
        stopped = false,
        busy = false,
        selected = null,
        tasks = [],
        timer = null,
        hostOrigin = "*";
      const pending = new Map(),
        $ = (id) => document.getElementById(id),
        t = (key) => words[language][key],
        label = (value) =>
          language === "zh" ? statusZh[value] || value : value;
      function element(tag, text, className) {
        const el = document.createElement(tag);
        if (text != null) el.textContent = text;
        if (className) el.className = className;
        return el;
      }
      function post(message) {
        window.parent.postMessage({ jsonrpc: "2.0", ...message }, hostOrigin);
      }
      function rpc(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++nextId;
          const timeout = setTimeout(() => {
            pending.delete(id);
            reject(new Error("Host response timed out"));
          }, 20000);
          pending.set(id, { resolve, reject, timeout });
          post({ id, method, params });
        });
      }
      function notice(text, error = false) {
        $("notice").textContent = text;
        $("notice").dataset.error = String(error);
      }
      function data(result) {
        if (result.isError)
          throw new Error(
            result.structuredContent?.message ||
              result.content?.find((c) => c.type === "text")?.text ||
              "Tool failed",
          );
        if (result.structuredContent) return result.structuredContent;
        const text = result.content?.find((c) => c.type === "text")?.text;
        return text ? JSON.parse(text) : {};
      }
      async function tool(name, args = {}) {
        return data(await rpc("tools/call", { name, arguments: args }));
      }
      function badge(value) {
        const span = element("span", label(value), "badge");
        span.dataset.status = value;
        return span;
      }
      function render() {
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
        $("language").value = language;
        document
          .querySelectorAll("[data-i]")
          .forEach((el) => (el.textContent = t(el.dataset.i)));
        const active = tasks.filter((task) =>
          ["running", "queued", "submitted"].includes(task.status),
        ).length;
        $("count-active").textContent = active;
        $("count-finished").textContent = tasks.length - active;
        $("count-delivery").textContent = tasks.filter((task) =>
          ["failed", "uncertain", "sending"].includes(task.delivery),
        ).length;
        const list = $("tasks");
        list.replaceChildren();
        if (!tasks.length) list.append(element("div", t("empty"), "empty"));
        for (const task of tasks) {
          const button = element("button", null, "task");
          button.setAttribute(
            "aria-pressed",
            String(selected === task.task_id),
          );
          const row = element("div", null, "meta");
          row.append(
            element("span", task.task_key || task.task_id, "key"),
            badge(task.status),
          );
          button.append(
            row,
            element("div", task.program || task.task_id, "sub"),
          );
          const delivery = element("div", null, "sub");
          delivery.append(
            document.createTextNode(t("delivery") + ": "),
            badge(task.delivery),
          );
          button.append(delivery);
          button.onclick = () => {
            selected = task.task_id;
            render();
            loadDetail();
          };
          list.append(button);
        }
        if (!selected) $("detail").replaceChildren(element("p", t("select")));
      }
      async function loadDetail() {
        if (!selected || !ready) return;
        const id = selected;
        try {
          const task = await tool("get_task", { task_id: id });
          if (id !== selected) return;
          const summary = tasks.find((task) => task.task_id === id) || {};
          const detail = $("detail"),
            dl = element("dl");
          for (const [key, value] of [
            ["id", id],
            ["status", label(task.status)],
            ["delivery", label(task.delivery)],
            ["cwd", summary.cwd],
            [
              "deadline",
              summary.timeout_ms
                ? `${summary.timeout_ms / 1000}s`
                : t("unlimited"),
            ],
            ["exit", task.result?.exit_code ?? "—"],
            [
              "duration",
              task.result?.elapsed_ms != null
                ? `${(task.result.elapsed_ms / 1000).toFixed(1)}s`
                : task.started_at_ms
                  ? `${((Date.now() - task.started_at_ms) / 1000).toFixed(1)}s`
                  : "—",
            ],
            ["receipt", task.receipt?.turn?.id],
          ]) {
            if (value != null)
              dl.append(element("dt", t(key)), element("dd", String(value)));
          }
          detail.replaceChildren(dl);
          if (task.delivery_error)
            detail.append(element("p", task.delivery_error));
          const tail = task.result?.output_tail || task.output_tail || {};
          detail.append(
            element("h3", t("output")),
            element(
              "pre",
              [tail.stdout, tail.stderr, task.result?.message]
                .filter(Boolean)
                .join("\n") || t("nooutput"),
            ),
          );
        } catch (error) {
          notice(`${t("failed")}: ${error.message}`, true);
        }
      }
      async function refresh() {
        if (!ready || busy || stopped || document.hidden) return;
        busy = true;
        $("refresh").disabled = true;
        let delay = 3000;
        try {
          const result = await tool("list_tasks");
          tasks = result.tasks || [];
          if (selected && !tasks.some((task) => task.task_id === selected))
            selected = null;
          render();
          await loadDetail();
          notice(
            `${t("updated")} ${new Date().toLocaleTimeString()}${result.truncated ? " · " + t("truncated") : ""}`,
          );
        } catch (error) {
          notice(`${t("failed")}: ${error.message}`, true);
          delay = 15000;
        } finally {
          busy = false;
          $("refresh").disabled = false;
          clearTimeout(timer);
          if ($("auto").checked && !stopped) timer = setTimeout(refresh, delay);
        }
      }
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        if (hostOrigin === "*" && event.origin && event.origin !== "null")
          hostOrigin = event.origin;
        if (hostOrigin !== "*" && event.origin !== hostOrigin) return;
        if (message.id != null && !message.method) {
          const entry = pending.get(message.id);
          if (!entry) return;
          clearTimeout(entry.timeout);
          pending.delete(message.id);
          message.error
            ? entry.reject(new Error(message.error.message || "Host error"))
            : entry.resolve(message.result);
          return;
        }
        if (message.method === "ui/notifications/tool-result") {
          try {
            const result = data(message.params);
            if (result.tasks) {
              tasks = result.tasks;
              render();
            }
          } catch (error) {
            notice(error.message, true);
          }
          refresh();
        }
        if (
          message.method === "ui/notifications/host-context-changed" &&
          message.params.theme
        )
          document.documentElement.dataset.theme = message.params.theme;
        if (message.method === "ping") post({ id: message.id, result: {} });
        if (message.method === "ui/resource-teardown") {
          stopped = true;
          clearTimeout(timer);
          post({ id: message.id, result: {} });
        }
      });
      $("language").onchange = () => {
        language = $("language").value;
        render();
        loadDetail();
      };
      $("refresh").onclick = refresh;
      $("auto").onchange = () => {
        $("auto").checked ? refresh() : clearTimeout(timer);
      };
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) clearTimeout(timer);
        else if ($("auto").checked) refresh();
      });
      window.addEventListener("pagehide", () => {
        stopped = true;
        clearTimeout(timer);
      });
      new ResizeObserver(() => {
        if (ready)
          post({
            method: "ui/notifications/size-changed",
            params: {
              height: document.documentElement.scrollHeight,
              width: document.documentElement.clientWidth,
            },
          });
      }).observe(document.body);
      render();
      notice(t("connecting"));
      if (window.parent === window) notice(t("standalone"));
      else
        rpc("ui/initialize", {
          appInfo: { name: "TerminalHook tasks", version: "1.0.0" },
          appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
          protocolVersion: "2026-01-26",
        })
          .then((result) => {
            if (result.hostContext?.theme)
              document.documentElement.dataset.theme = result.hostContext.theme;
            post({ method: "ui/notifications/initialized", params: {} });
            ready = true;
            refresh();
          })
          .catch((error) => notice(error.message, true));
    </script>
  </body>
</html>
