name: CI

on:
  pull_request:
    branches: [alpha, beta, rc, main]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'

jobs:
  policy:
    uses: ./.github/workflows/source-policy.yml
    with:
      alpha_refresh: ${{ github.event_name == 'workflow_dispatch' }}
      require_promotion_proof: ${{ github.event_name == 'pull_request' && github.base_ref != 'alpha' }}

  security:
    needs: policy
    uses: ./.github/workflows/security.yml

  validation:
    name: Linux source validation
    needs: [policy, security]
    if: github.base_ref == 'alpha' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check Rust formatting
        run: cargo fmt --check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Check and build the dashboard
        run: python scripts/dashboard.py build
      - name: Restore Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: source-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: source-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Check Rust lints
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Rust unit tests
        run: cargo test --locked
      - name: Check delivery, promotion evidence and release policy
        run: |
          PYTHONPATH=tests python -m unittest -v \
            test_delivery test_promotion_proof test_release_policy test_version

  quality:
    name: ${{ github.event_name == 'pull_request' && 'Quality checks' || 'Source refresh quality' }}
    if: always()
    needs: [policy, security, validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      POLICY: ${{ needs.policy.result }}
      SECURITY: ${{ needs.security.result }}
      VALIDATION: ${{ needs.validation.result }}
      CHECK_SOURCE: ${{ github.base_ref == 'alpha' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Require the checks for this source or promotion
        run: |
          test "$POLICY" = success
          test "$SECURITY" = success
          if [ "$CHECK_SOURCE" = true ]; then
            test "$VALIDATION" = success
          else
            test "$VALIDATION" = skipped
          fi

  evidence:
    name: ${{ github.event_name == 'pull_request' && 'Package verification' || 'Source refresh verification' }}
    if: always()
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      QUALITY: ${{ needs.quality.result }}
      CHECK_SOURCE: ${{ github.base_ref == 'alpha' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Require successful source or promotion validation
        run: test "$QUALITY" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.CHECK_SOURCE == 'true'
        with:
          persist-credentials: false
      - name: Record the checked-out source and CI attempt
        if: env.CHECK_SOURCE == 'true'
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          def revision(expression):
              return subprocess.check_output(["git", "rev-parse", expression], text=True).strip()

          head = revision("HEAD")
          if head != os.environ["GITHUB_SHA"]:
              raise SystemExit("The tested checkout does not match the event revision")
          report = {
              "passed": True,
              "source_revision": head,
              "source_tree": revision("HEAD^{tree}"),
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          output = Path("artifacts/source-validation.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.CHECK_SOURCE == 'true'
        with:
          name: source-validation
          path: artifacts/source-validation.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
