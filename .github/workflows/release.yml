name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Must match the selected workflow branch (production uses main)
        type: choice
        options: [alpha, beta, rc, production]
        required: true
      publish:
        description: Publish all verified platforms and advance their Git marketplaces
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  request:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce the selected channel and source branch
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          source_branch="$CHANNEL"
          if [ "$CHANNEL" = production ]; then source_branch=main; fi
          test "$GITHUB_REF" = "refs/heads/$source_branch"
  verify:
    needs: request
    uses: ./.github/workflows/ci.yml
    with:
      build_package: true
      long_wait: true
  publish:
    name: Publish verified distributions
    if: ${{ !cancelled() && needs.verify.result == 'success' && inputs.publish && github.repository == 'BANG404/Codex_Terminalhook' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.channel }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist
      - name: Publish the complete immutable platform set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python scripts/publish_release.py
      - name: Advance each platform's binary Git marketplace
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python scripts/publish_marketplace.py
