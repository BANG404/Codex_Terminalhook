# Standalone alternative to the plugin. Update the command to your absolute build path.
# Do not enable both standalone and plugin transports in the same session.
# Linux/macOS: replace command below with '/absolute/path/target/release/terminalhook'.
[mcp_servers.terminalhook]
command = 'D:\Projects\Codex_Terminalhook\target\release\terminalhook.exe'
startup_timeout_sec = 10
tool_timeout_sec = 660
env_vars = ["CODEX_HOME", "CODEX_APP_RUNTIME_CLI_PATH", "TERMINALHOOK_CODEX_BIN", "TERMINALHOOK_CODEX_SOCKET"]

[mcp_servers.terminalhook.tools.submit_task]
approval_mode = "approve"
