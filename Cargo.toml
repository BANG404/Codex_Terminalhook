[package]
name = "terminalhook"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Event-driven terminal output waits for Codex over MCP"
license = "MIT"
repository = "https://github.com/BANG404/Codex_Terminalhook"
readme = "README.md"

[dependencies]
regex = "1"
regex-syntax = "0.8"
portable-pty = "0.9"
tempfile = "3"
uuid = { version = "1", features = ["v4", "v5"] }
fs2 = "0.4"
notify = "8.2"
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "io-std", "sync", "time", "signal", "fs", "net"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_IO", "Win32_System_SystemServices", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
